<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cerebro TV Mercado</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; }
        button {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>Cerebro de Rotación</h1>
    <p>Mantené esta página abierta. Al iniciar, se abrirá/actualizará una pestaña nueva con el dashboard.</p>
    
    <button onclick="iniciarRotacion()">Iniciar Pantalla de TV</button>

    <script>
        const urls = [
            "https://matbarofex.primary.ventures/futuros/financieros",
            "https://cem.matbarofex.com.ar/",
            "https://matbarofex.primary.ventures/tiva/bonos",
            "https://marketdata.mae.com.ar/dashboard-tv/bcr"
        ];
        
        let indiceActual = 0;

        function rotarUrls() {
            // EL TRUCO MAGICO: 
            // En vez de intentar modificar la ventana (que da error de seguridad),
            // le decimos al navegador que abra la URL en la misma pestaña llamada "PantallaTV".
            // Esto recicla la pestaña abierta saltándose el bloqueo.
            window.open(urls[indiceActual], "PantallaTV");
            
            indiceActual++;
            if (indiceActual >= urls.length) {
                indiceActual = 0;
            }
        }

        function iniciarRotacion() {
            // Primer salto
            rotarUrls();
            
            // Loop cada 20 segundos
            setInterval(rotarUrls, 20000);
            
            // Feedback visual
            const btn = document.querySelector('button');
            btn.innerText = "Rotando... (Mirá la otra pestaña)";
            btn.style.background = "#28a745";
        }
    </script>

</body>
</html>
