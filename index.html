<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TV Mercado</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

iframe {
    width: 100vw;
    height: 100vh;
    border: none;
}
</style>
</head>

<body>

<iframe id="viewer"></iframe>

<script>
const urls = [
  "https://matbarofex.primary.ventures/futuros/financieros",
  "https://cem.matbarofex.com.ar/",
  "https://matbarofex.primary.ventures/tiva/bonos",
  "https://marketdata.mae.com.ar/",
  "https://marketdata.mae.com.ar/dashboard-tv/bcr"
];

let i = 0;
const viewer = document.getElementById("viewer");

function rotate() {
    viewer.src = urls[i];
    i = (i + 1) % urls.length;
}

rotate();
setInterval(rotate, 20000);
</script>

</body>
</html>
