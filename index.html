<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TV Mercado</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

#status {
    font-size: 32px;
    text-align: center;
}
</style>
</head>

<body>

<div id="status">
    Iniciando TV Mercado...
</div>

<script>
const urls = [
    "https://matbarofex.primary.ventures/futuros/financieros",
    "https://cem.matbarofex.com.ar/",
    "https://matbarofex.primary.ventures/tiva/bonos",
    "https://marketdata.mae.com.ar/",
    "https://marketdata.mae.com.ar/dashboard-tv/bcr"
];

const rotationTime = 20000; // 20 segundos

let currentIndex = 0;
let marketWindow = null;

function rotateMarkets() {

    const currentUrl = urls[currentIndex];

    document.getElementById("status").innerText =
        "Mostrando:\n" + currentUrl;

    if (!marketWindow || marketWindow.closed) {

        marketWindow = window.open(
            currentUrl,
            "tvmercado"
        );

    } else {

        marketWindow.location.href = currentUrl;

    }

    currentIndex++;

    if (currentIndex >= urls.length) {
        currentIndex = 0;
    }
}

rotateMarkets();

setInterval(rotateMarkets, rotationTime);

</script>

</body>
</html>
