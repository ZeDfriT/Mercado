<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TV Mercado</title>

<script>
const urls = [
  "https://matbarofex.primary.ventures/futuros/financieros",
  "https://cem.matbarofex.com.ar/",
  "https://matbarofex.primary.ventures/tiva/bonos",
  "https://marketdata.mae.com.ar/",
  "https://marketdata.mae.com.ar/dashboard-tv/bcr"
];

const interval = 20; // segundos

function getCurrentIndex() {
  const params = new URLSearchParams(window.location.search);
  return parseInt(params.get("page") || "0", 10);
}

const index = getCurrentIndex();
const next = (index + 1) % urls.length;

// Programamos el siguiente cambio antes de irnos
setTimeout(() => {
  window.location.href =
    window.location.origin +
    window.location.pathname +
    "?page=" + next;
}, interval * 1000);

// Abrimos la URL actual
window.location.replace(urls[index]);

</script>

</head>
<body style="margin:0;background:black;">
</body>
</html>
